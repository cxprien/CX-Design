<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>

  <!-- instant redirect fallback -->
  <meta http-equiv="refresh" content="0; url=https://cxprien.github.io/CX-Design/pages/home/index.html" />

  <script>
    // JS redirect (more reliable than meta refresh in some cases)
    window.location.replace("https://cxprien.github.io/CX-Design/pages/home/index.html");
  </script>
</head>

<body>
  <p>Redirecting...</p>
  <a href="https://cxprien.github.io/CX-Design/pages/home/index.html">
    Click here if not redirected
  </a>
</body>
</html>
